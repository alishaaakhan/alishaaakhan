vetica Neue, Arial, sans-serif" font-size="14" font-weight="400" fill="#cbd5e1" text-anchor="start" >temperature, humidity, soil moisture, and motion detection sensors.</text><text x="40" y="200" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="400" fill="#cbd5e1" text-anchor="start" >The dashboard maintained sensor history and supported real-time</text><text x="40" y="222" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="400" fill="#cbd5e1" text-anchor="start" >monitoring updates.</text><rect x="40" y="252" width="820" height="38" rx="19" fill="#fb923c" fill-opacity=".1" stroke="#fb923c" stroke-opacity=".7"/><text x="60" y="276" font-family="SF Mono, Consolas, Menlo, monospace" font-size="10.5" font-weight="700" fill="#fdba74" text-anchor="start" letter-spacing="2">ACHIEVEMENT</text><text x="186" y="276" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#ffedd5" text-anchor="start" >3rd Position - Super 50 Workshop: From Sensors to Intelligence: IoT Meets GenAI on Cloud</text><rect x="40" y="304" width="196" height="34" rx="17" fill="url(#acc)"/><text x="138" y="326" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="700" fill="#04101f" text-anchor="middle" >View on GitHub  &gt;</text><text x="252" y="326" font-family="SF Mono, Consolas, Menlo, monospace" font-size="11.5" font-weight="400" fill="#64748b" text-anchor="start" >github.com/alishaaakhan</text><text x="640" y="60" font-family="SF Mono, Consolas, Menlo, monospace" font-size="10.5" font-weight="600" fill="#fb923c" text-anchor="start" >TEMP</text><polyline points="710.0,56.0 718.0,61.7 726.0,65.8 734.0,67.0 742.0,64.9 750.0,60.2 758.0,54.3 766.0,48.8 774.0,45.5 782.0,45.3 790.0,48.2 798.0,53.5 806.0,59.4 814.0,64.4 822.0,66.9 830.0,66.1 838.0,62.4 846.0,56.8 854.0,51.0 862.0,46.6 870.0,45.0" fill="none" stroke="#fb923c" stroke-width="2" stroke-linejoin